<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero | Jordan Santander</title>
    
    <!-- Vinculación correcta -->
    <link rel="stylesheet" href="./style.css">

</head>

 <!-- COLOR BASE FONDO Y TEXTO ESTILO+COLOR -->
 <!-- OVERFLOW ES PARA EL SCROLL LATERAL Y AJUSTAR LA PANTALLA -->
 <!-- MIN-H-SCREEN ESTABLECE LA ALTURA MININA DE UN ELEMENTO  EN ESTE CASO LA PANTALLA -->
<body class="
bg-gradient-main 
min-h-screen 
text-white 
font-sans 
overflow-x-hidden
">


<!-- NAV + LOGO -->
<header class="max-w-7xl mx-auto flex justify-between items-center p-6 md:p-10">
  <div class="font-bold tracking-tighter text-xl">FUNVAL</div>

  <!-- Aparece automáticamente en Desktop (md: 768px) -->
  <nav class="hidden md:flex gap-10 text-[12px] font-bold tracking-[0.2em] text-[#8892B0]">
    <a href="#" class="hover:text-white transition">SOBRE MI</a>
    <a href="#" class="hover:text-white transition">HABILIDADES</a>
    <a href="#" class="hover:text-white transition">PROYECTOS</a>
  </nav>

  <button class="border border-[#E3FF6A] text-[#E3FF6A] px-4 py-2 md:px-6 md:py-2 rounded-full text-[10px] md:text-[11px] font-bold tracking-widest flex items-center gap-2 hover:bg-[#E3FF6A] hover:text-black transition">
    CONTACTO
    <span class="bg-[#E3FF6A] text-black rounded-full w-4 h-4 flex items-center justify-center text-[10px]">↗</span>
  </button>
</header>

<main class="relative max-w-7xl mx-auto flex flex-col items-center pt-10 md:pt-16 px-4">

  <!-- Títulos adaptables -->
  <div class="text-center z-10 flex flex-col items-center w-full">
      <h2 class="text-xl md:text-3xl font-light tracking-tight text-white/90">
          Soy <span class="text-[#E3FF6A] font-bold">Jordan Santander Phillips</span>
      </h2>
      <h1 class="mt-4 md:mt-6 flex flex-col md:flex-row items-center justify-center gap-2 tracking-tighter">
          <span class="inline-block border border-white/20 bg-transparent px-5 py-2 md:px-8 md:py-3 rounded-2xl text-3xl md:text-6xl font-bold backdrop-blur-sm shadow-xl tracking-tighter">
              Front End
          </span>
          <span class="text-3xl md:text-6xl font-bold tracking-tighter">
              Developer
          </span>
      </h1>
  </div>

  <div class="relative w-full max-w-6xl flex justify-center items-end min-h-[450px] md:min-h-[550px] mt-10">
    
    <!-- TARJETA IZQUIERDA (Reseña) -->
    <!-- 'hidden' en móvil, 'md:block' para que aparezca en desktop -->
    <div class="hidden md:block absolute left-0 lg:left-10 bottom-32 z-30 w-56 lg:w-64 p-5 rounded-2xl bg-[#1E293B]/60 backdrop-blur-md border border-white/5 -rotate-3 shadow-2xl">
        <p class="text-[9px] font-bold text-[#8892B0] mb-2 tracking-[0.2em]">RESEÑA DE CLIENTE</p>
        <h4 class="text-md font-bold mb-2">Australia <span class="bg-blue-600/20 text-blue-400 px-1 rounded text-[10px]">AU</span></h4>
        <p class="text-[11px] text-[#8892B0] leading-relaxed italic">"Excelente desarrollador web. Muy recomendable."</p>
    </div>

    <!-- IMAGEN CENTRAL -->
    <div class="relative z-20 w-full max-w-[280px] md:max-w-md flex justify-center">
      <img src="/image_47eb3cbb.png" alt="IMAGEN DE JORDAN" class="w-full h-auto object-contain">
      <button class="absolute -bottom-4 md:bottom-8 bg-[#E3FF6A] text-black px-8 py-3 rounded-full text-[10px] font-black tracking-widest uppercase shadow-lg hover:scale-105 transition-transform">
        PROYECTOS
      </button>
    </div>

    <!-- TARJETA DERECHA (Conocimientos) -->
    <!-- 'hidden' en móvil, 'md:block' para que aparezca en desktop -->
    <div class="hidden md:block absolute right-0 lg:right-10 bottom-24 z-30 w-56 lg:w-64 p-6 rounded-2xl bg-[#1E293B]/60 backdrop-blur-md border border-white/5 rotate-3 shadow-2xl">
        <p class="text-[9px] font-bold text-[#8892B0] mb-5 tracking-[0.2em] uppercase">Mis Conocimientos</p>
        <div class="space-y-4">
          <!-- Barra de ejemplo: Frontend -->
          <div>
            <div class="flex justify-between text-[9px] font-bold mb-1 uppercase">
              <span>Frontend</span>
              <span class="text-[#8892B0]">95%</span>
            </div>
            <div class="h-[2px] w-full bg-white/10 rounded-full">
              <div class="h-full bg-[#E3FF6A] rounded-full" style="width: 95%"></div>
            </div>
          </div>
        </div>
    </div>

  </div>
</main>

</body>

</html>
