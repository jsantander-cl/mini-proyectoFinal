<!doctype html>
<html lang="es" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portafolio | Jordan Santander</title>
    <link rel="stylesheet" href="./style.css" />
    <!-- <script type="module" src="./tema.js"></script> -->
    <script></script>
  </head>

  <body
    class="bg-[#0B0F1A] dark:bg-[#F1F5F9] min-h-screen text-white font-sans overflow-x-hidden transition-colors duration-300"
  >
    <!-- HEADER -->
    <header
      id="render-header"
      class="w-full mx-auto flex justify-between items-center p-6 md:p-10 dark:bg-gray-500"
    ></header>

    <!-- HERO -->
    <main
      id="render-hero"
      class="relative max-w-7xl mx-auto flex flex-col items-center pt-10 md:pt-16 px-4"
    ></main>

    <!-- SOBRE MÍ -->
    <section
      class="w-full min-h-screen bg-[#0B0F1A] dark:bg-[#F1F5F9] flex items-center justify-center px-6 py-20 overflow-hidden transition-colors duration-300"
    >
      <div
        id="render-sobre-mi"
        class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-[1fr_2fr_1fr] gap-10 items-center w-full"
      ></div>
    </section>

    <!-- HABILIDADES -->
    <section
      class="w-full bg-[#0B0F1A] dark:bg-[#F1F5F9] py-20 px-6 transition-colors duration-300"
    >
      <div id="render-habilidades" class="max-w-6xl mx-auto"></div>
    </section>

    <!-- EMPRESAS -->
    <section
      id="render-empresas"
      class="w-full min-h-screen bg-[#0B0F1A] dark:bg-[#F1F5F9] text-white py-20 px-6 flex flex-col lg:flex-row items-center justify-center gap-12 overflow-hidden transition-colors duration-300"
    ></section>

    <!-- CONTACTO -->
    <section
      id="contacto"
      class="w-full min-h-screen bg-[#0B0F1A] dark:bg-[#F1F5F9] flex items-center justify-center px-6 py-12 transition-colors duration-300"
    >
      <div
        id="render-contacto"
        class="w-full max-w-2xl bg-white rounded-[2.5rem] p-10 md:p-16 shadow-2xl"
      ></div>
    </section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
