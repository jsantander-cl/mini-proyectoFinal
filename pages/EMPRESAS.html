<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Empresas</title>
</head>
<body>
    <section class="
  w-full 
  min-h-screen 
  bg-[#0B0F1A] 
  text-white 
  py-20 
  px-6 
  flex 
  flex-col 
  lg:flex-row 
  items-center 
  justify-center 
  gap-12 
  overflow-hidden">

 <!-- TEXTO DERECHO -->
<div class="
  w-full 
  lg:w-1/2 
  flex 
  flex-col 
  items-center 
  lg:items-start 
  lg:pl-30 
  lg:pr-10
  text-center 
  lg:text-left 
  z-10">
  
  <h2 class="
    text-4xl 
    md:text-5xl 
    lg:text-6xl 
    font-bold 
    uppercase 
    leading-tight 
    tracking-tighter 
    mb-10">
    EMPRESAS QUE  <br>
    TRABAJAN CON <br>
    NOSOTROS
  </h2>

  <button class="
    bg-[#E3FF6A] 
    text-black 
    px-20 
    py-4 
    rounded-full 
    text-[20px] 
    font-black 
    uppercase 
    tracking-widest 
    shadow-lg 
    hover:scale-105 
    transition-transform">
    MIS PROYECTOS
  </button>
</div>

  <!-- CONTENEDOR DE IMÁGENES-->
<div class="
  w-full 
  lg:w-1/2
  flex 
  items-center 
  justify-center 
  gap-4 
  h-100
  md:h-125
  
  ">

  <!-- TARJETA 1 -->
  <div class="
    relative 
    w-24 
    md:w-150
    h-full 
    rounded-[2.5rem] 
    overflow-hidden 
    shadow-2xl 
    border 
    border-white/10">
    <img src="./IMG/image copy 15.png" class="
      w-full 
      h-full 
      object-cover">
  </div>

  <!-- TARJETA 2 -->
  <div class="
    w-24 
    md:w-44 
    h-full 
    rounded-[2.5rem] 
    overflow-hidden 
    shadow-2xl 
    border 
    border-white/10">
    <img src="./IMG/image copy 16.png" class="
      w-full 
      h-full 
      object-cover">
  </div>

  <!-- TARJETA 3 -->
  <div class="
    w-24 
    md:w-44 
    h-full 
    rounded-[2.5rem] 
    overflow-hidden 
    shadow-2xl 
    border 
    border-white/10">
    <img src="./IMG/image copy 17.png" class="
      w-full 
      h-full 
      object-cover">
  </div>

</div>

</section>
</body>
</html>
