<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    

<section class="
  w-full 
  min-h-screen 
  bg-[#0B0F1A] 
  flex 
  items-center 
  justify-center 
  px-6 
  py-12">

  <!-- TARJETA -->
  <div class="
    w-full 
    max-w-2xl 
    bg-white 
    rounded-[2.5rem] 
    p-10 
    md:p-16 
    shadow-2xl">

    <!-- TÍTULO -->
    <h2 class="
      text-[#0B0F1A] 
      text-3xl 
      md:text-5xl 
      font-black 
      text-center 
      uppercase 
      tracking-tighter 
      mb-12">
      CONTACTAME
    </h2>

    <!-- FORMULARIO -->
    <form class="
      flex 
      flex-col 
      gap-6">

      <!-- INPUT: NOMBRE -->
      <input 
        type="text" 
        placeholder="TU NOMBRE" 
        class="
          w-full 
          bg-[#E5E7EB] 
          text-[#1F2937] 
          text-[10px] 
          font-bold 
          px-8 
          py-5 
          rounded-2xl 
          outline-none 
          placeholder:text-gray-400 
          tracking-widest">

      <!-- INPUT: EMAIL -->
      <input 
        type="email" 
        placeholder="CORREO ELECTRONICO" 
        class="
          w-full 
          bg-[#E5E7EB] 
          text-[#1F2937] 
          text-[10px] 
          font-bold 
          px-8 
          py-5 
          rounded-2xl 
          outline-none 
          placeholder:text-gray-400 
          tracking-widest">

      <!-- TEXTAREA: MENSAJE -->
      <textarea 
        placeholder="TU MENSAJE" 
        rows="4" 
        class="
          w-full 
          bg-[#E5E7EB] 
          text-[#1F2937] 
          text-[10px] 
          font-bold 
          px-8 
          py-5 
          rounded-2xl 
          outline-none 
          resize-none 
          placeholder:text-gray-400 
          tracking-widest"></textarea>

      <!-- BOTÓN DE ENVÍO -->
      <button 
        type="submit" 
        class="
          w-full 
          bg-[#E3FF6A] 
          text-[#0B0F1A] 
          text-[11px] 
          font-black 
          uppercase 
          tracking-[0.2em] 
          py-5 
          rounded-full 
          mt-4 
          hover:opacity-90 
          transition-opacity 
          shadow-lg">
        ENVIAR
      </button>

    </form>
  </div>

</section>
</body>
