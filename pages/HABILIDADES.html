<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HABILIDADES</title>
    <link rel="stylesheet" href="./style.css">
</head>


<body>
    <section class="
       w-full 
     bg-[#0B0F1A] 
       py-20 
       px-6">

  <div class="
    max-w-6xl 
    mx-auto">

    <!-- TITULO -->
    <h2 class="
      text-[#E3FF6A] 
      text-3xl 
      md:text-5xl 
      font-black 
      text-center 
      uppercase 
      mb-12 
      tracking-tighter">
      MIS HABILIDADES
    </h2>

    <!-- CAJAS PRINCIPALES GRID -->
    <div class="
      grid 
      grid-cols-2 
      md:grid-cols-4 
      lg:grid-cols-5 
      gap-4">

      <!-- TARJETAS DE SKILLS logos 1 al 8-->
      
      <div class="
        bg-[#111827] 
        aspect-square 
        rounded-2xl 
        flex 
        items-center 
        justify-center 
        border 
        border-white/5">
        <img src="./IMG/image copy 12.png" alt="imagen1" class="w-30 h-30">
      </div>

      <div class="bg-[#111827] aspect-square rounded-2xl flex items-center justify-center border border-white/5"><img src="./IMG/image copy.png" alt="foto2" class="w-30 h-30"></div>
      <div class="bg-[#111827] aspect-square rounded-2xl flex items-center justify-center border border-white/5"><img src="./IMG/image copy 2.png" alt="foto3" class="w-30 h-30"></div>
      <div class="bg-[#111827] aspect-square rounded-2xl flex items-center justify-center border border-white/5"><img src="./IMG/image copy 3.png" alt="foto4" class="w-30 h-30"></div>
      <div class="bg-[#111827] aspect-square rounded-2xl flex items-center justify-center border border-white/5"><img src="./IMG/image copy 4.png" alt="foto5" class="w-30 h-30"></div>
      <div class="bg-[#111827] aspect-square rounded-2xl flex items-center justify-center border border-white/5"><img src="./IMG/image copy 5.png" alt="foto6" class="w-30 h-30"></div>
      <div class="bg-[#111827] aspect-square rounded-2xl flex items-center justify-center border border-white/5"><img src="./IMG/image copy 14.png" alt="foto7" class="w-30 h-30"></div>
      <div class="bg-[#111827] aspect-square rounded-2xl flex items-center justify-center border border-white/5"><img src="./IMG/image copy 7.png" alt="foto8" class="w-30 h-30"></div>

      <!-- TARJETA (Experiencia) -->
      <!-- En movil ocupa 2 columnas, en Desktop se ajusta a la pantalla-->
      <div class="
        col-span-2 
        bg-[#111827] 
        rounded-2xl 
        p-5 
        flex 
        flex-col
        items-center 
        justify-center 
        text-center 
        border 
        border-white/5">
        
        <span class="
          text-6xl 
          font-black 
          text-white 
          mb-2">1</span>
        
        <p class="
          text-gray-400 
          text-sm 
          font-bold 
          leading-tight 
          mb-6"
          >MES <br> 
          de Experiencia <br> 
        </p>


        <!-- boton de curriculum -->
        <button class="
          bg-[#E3FF6A] 
          text-black 
          px-8 
          py-4 
          rounded-full 
          text-[9px] 
          font-black 
          uppercase 
          tracking-widest">
          DESCARGAR MI CV
        </button>
      </div>
    </div>

    <!-- SECCIÓN HABILIDADES ADICIONALES -->
    <div class="
      mt-12 
      p-8 
      bg-[#111827]/50 
      rounded-3xl 
      border 
      border-white/5">
      
      <h3 class="
        text-[#E3FF6A] 
        text-center 
        text-sm 
        font-bold 
        uppercase 
        tracking-widest 
        mb-8">
        HABILIDADES ADICIONALES
      </h3>

      <div class="
        flex 
        flex-wrap 
        justify-center 
        gap-40 
        opacity-50">
        
        <!-- skill adicionales -->
        <img src="./IMG/image copy 8.png" class="h-20 ">
        <img src="./IMG/image copy 9.png" class="h-20 ">
        <img src="./IMG/image copy 10.png" class="h-20 ">
        <img src="./IMG/image copy 11.png" class="h-20 ">
      </div>
    </div>

  </div>
</section>
</body>
</html>
