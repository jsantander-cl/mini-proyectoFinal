<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero | Jordan Santander</title>
   
    <link rel="stylesheet" href="./style.css">
</head>

<body class="
  bg-[#0B0F1A] 
  min-h-screen 
  text-white 
  font-sans 
  overflow-x-hidden">

  <!-- HEADER -->
  <header class="
    w-full
    mx-auto 
    flex 
    justify-between 
    items-center 
    p-6 
    md:p-10">

    <div class="
      font-bold 
      text-xl 
      tracking-tighter">
      FUNVAL
    </div>
    
    <!-- Navegación: Oculta en móvil, aparece en Desktop (md) -->
    <nav class="
      hidden 
      md:flex 
      gap-10 
      text-[12px] 
      font-bold 
      tracking-[0.2em] 
      text-[#8892B0]">
      <a href="/pages/SOBREMI.html" class="hover:text-white transition">SOBRE MI</a>
      <a href="/pages/HABILIDADES.html" class="hover:text-white transition">HABILIDADES</a>
      <a href="/pages/HOJA4.html" class="hover:text-white transition">PROYECTOS</a>
    </nav>

    <button class="
      border 
      border-[#E3FF6A] 
      text-[#E3FF6A] 
      px-5 
      py-2 
      rounded-full 
      text-[10px] 
      font-bold 
      tracking-widest 
      hover:bg-[#E3FF6A] 
      hover:text-black 
      transition-all">
      CONTACTO
    </button>
  </header>

  <!-- MAIN CONTENT -->
  <main class="
    relative 
    max-w-7xl 
    mx-auto 
    flex 
    flex-col 
    items-center 
    pt-10 
    md:pt-16 
    px-4">

    <!-- SECCIÓN TEXTOS -->
    <div class="
      text-center 
      z-10 
      flex 
      flex-col 
      items-center 
      w-full">
      
      <h2 class="
        text-xl 
        md:text-3xl 
        font-light 
        tracking-tight 
        text-white/90">
        Soy <span class="text-[#E3FF6A] font-bold">Jordan Santander Phillips</span>
      </h2>
      
      <!-- H1: Apilado en móvil, en línea en PC -->
      <h1 class="
        mt-4 
        md:mt-6 
        flex 
        flex-col 
        md:flex-row 
        items-center 
        justify-center 
        gap-2">
        
        <span class="
          border 
          border-white/20 
          bg-transparent 
          px-5 
          py-2 
          md:px-8 
          md:py-3 
          rounded-2xl 
          text-3xl 
          md:text-6xl 
          font-bold 
          backdrop-blur-sm 
          shadow-xl 
          tracking-tighter">
          Front End
        </span>
        
        <span class="
          text-3xl 
          md:text-6xl 
          font-bold 
          tracking-tighter">
          Developer
        </span>
      </h1>
    </div>

    <!-- CONTENEDOR CENTRAL: IMAGEN + BOTÓN + TARJETAS -->
    <div class="
      relative 
      w-full 
      max-w-6xl 
      flex 
      justify-center 
      items-end 
      min-h-[400px] 
      md:min-h-[550px] 
      mt-10">
      
      <!-- RESPLANDOR DE FONDO -->
      <div class="
        absolute 
        bottom-20 
        w-48 
        h-64 
        md:w-64 
        md:h-80 
        bg-yellow-400/40 
        rounded-full 
        blur-[100px] 
        z-0">
      </div>
      
 <!-- FOTO + BOTÓN (Arreglado con margen negativo) -->
      <div class="
        relative 
        z-20 
        w-full 
        max-w-[280px] 
        md:max-w-md 
        flex 
        flex-col 
        items-center">
        
        <img src="./IMG/image_47eb3cbb.png" alt="Jordan" class="
          w-full 
          h-auto 
          object-contain">

        <button class="
          -mt-8 
          z-30 
          bg-[#E3FF6A] 
          text-black 
          px-10 
          py-3 
          rounded-full 
          text-[10px] 
          font-black 
          uppercase 
          shadow-2xl 
          hover:scale-105 
          transition-transform">
          PROYECTOS
        </button>
      </div>

<!-- TARJETA IZQUIERDA -->
<div class="
  hidden 
  md:block 
  absolute 
  left-0 
  lg:left-10 
  bottom-32 
  z-30 
  w-72 
  lg:w-80 
  p-8 
  rounded-3xl 
  bg-[#1E293B]/60 
  backdrop-blur-md 
  border 
  border-white/5 
  -rotate-3 
  shadow-2xl">
  
  <p class="
    text-[11px] 
    font-bold 
    text-[#8892B0] 
    mb-3 
    tracking-[0.2em] 
    uppercase">
    Reseña de cliente
  </p>
  
  <p class="
    text-[14px] 
    leading-relaxed 
    italic 
    text-white/90">
    "Excelente desarrollador web. Muy recomendable."
  </p>
</div>

<!-- TARJETA DERECHA -->
<div class="
  hidden 
  md:block 
  absolute 
  right-0 
  lg:right-10 
  bottom-24 
  z-30 
  w-72 
  lg:w-80 
  p-8 
  rounded-3xl 
  bg-[#1E293B]/60 
  backdrop-blur-md 
  border 
  border-white/5 
  rotate-3 
  shadow-2xl">
  
  <p class="
    text-[11px] 
    font-bold 
    text-[#8892B0] 
    mb-6 
    uppercase 
    tracking-[0.2em]">
    Mis Conocimientos
  </p>
  
  <div class="space-y-6">
    <!-- Skill Frontend -->
    <div>
      <div class="
        flex 
        justify-between 
        text-[12px] 
        font-bold 
        mb-2 
        uppercase">
        <span>Frontend</span>
        <span class="text-[#8892B0]">95%</span>
      </div>
      <div class="
        h-[3px] 
        w-full 
        bg-white/10 
        rounded-full 
        overflow-hidden">
        <div class="h-full bg-[#E3FF6A]" style="width: 95%"></div>
      </div>
    </div>
    
    <!-- Skill Backend -->
    <div>
      <div class="
        flex 
        justify-between 
        text-[12px] 
        font-bold 
        mb-2 
        uppercase">
        <span>Backend</span>
        <span class="text-[#8892B0]">85%</span>
      </div>
      <div class="
        h-[3px] 
        w-full 
        bg-white/10 
        rounded-full 
        overflow-hidden">
        <div class="h-full bg-[#E3FF6A]" style="width: 85%"></div>
      </div>
    </div>
  </div>
</div>

    </div>
  </main>

</body>
</html>
